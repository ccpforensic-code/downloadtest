<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>檔案下載速度測試</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f3f4f6;
            color: #111827;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang TC",
                "Microsoft JhengHei",
                sans-serif;
        }

        .container {
            width: min(920px, 100%);
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(25px, 5vw, 36px);
        }

        .description {
            margin: 0 0 20px;
            color: #4b5563;
            line-height: 1.7;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 18px 0;
        }

        .file-card {
            margin: 14px 0;
            padding: 18px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        }

        .file-name {
            margin-bottom: 7px;
            font-size: 18px;
            font-weight: 700;
            word-break: break-all;
        }

        .file-url {
            margin-bottom: 14px;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.5;
            word-break: break-all;
        }

        button {
            min-height: 46px;
            padding: 10px 18px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .secondary-button {
            background: #374151;
        }

        .secondary-button:hover:not(:disabled) {
            background: #1f2937;
        }

        progress {
            display: none;
            width: 100%;
            height: 19px;
            margin-top: 15px;
        }

        .status {
            min-height: 25px;
            margin-top: 12px;
            color: #374151;
            line-height: 1.6;
            word-break: break-word;
        }

        .success {
            color: #047857;
            font-weight: 600;
        }

        .error {
            color: #dc2626;
            font-weight: 600;
        }

        .warning {
            margin-top: 20px;
            padding: 14px;
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 10px;
            color: #92400e;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
            }

            .file-card {
                padding: 15px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <h1>檔案下載速度測試</h1>

    <p class="description">
        點擊個別檔案開始下載及測速。每次請求都會加入隨機參數，
        並要求瀏覽器不要使用 HTTP 快取。下載完成後會顯示平均速度，
        並以新檔名儲存。
        測速紀錄只會先儲存在此瀏覽器，
        必須按下「上傳紀錄」才會回傳 Server。
    </p>

    <div class="toolbar">
        <button
            id="upload-records"
            class="secondary-button"
            type="button"
        >
            上傳紀錄
        </button>

        <button
            id="reset-results"
            class="secondary-button"
            type="button"
        >
            清除畫面結果
        </button>
    </div>

    <div id="upload-status" class="status">
        速度紀錄：檢查中……
    </div>

    <div id="file-list"></div>

    <div class="warning">
        此網頁使用 JavaScript Fetch 讀取外部下載網址。
        如果外部伺服器不允許跨來源存取（CORS），
        瀏覽器可能會阻止測速，並顯示
        「Failed to fetch」或 CORS 錯誤。
    </div>
</div>

<script>
const files = [
    {
        linkNumber: 8,
        label: "Link 1",
        name: "Cvent File 8.23 MB",
        url: "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/241e3b3db2cc47e0bb056f054e4532dc.pdf"
    },
    {
        linkNumber: 9,
        label: "Link 2",
        name: "Cvent File 9.73 MB",
        url: "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/1915ccb2f13946f9acffc74f82c529c2.pdf"
    },
    {
        linkNumber: 10,
        label: "Cloudflare 20 MB 測速",
        name: "Cloudflare_20MB.bin",
        url: "https://speed.cloudflare.com/__down?bytes=20000000"
    }
];

const API_URL = "/api/download-results";
const PENDING_KEY = "cvent_pending_download_records_v1";

const fileList =
    document.getElementById("file-list");

const uploadStatus =
    document.getElementById("upload-status");

const uploadButton =
    document.getElementById("upload-records");

const resetButton =
    document.getElementById("reset-results");

const fileElements = [];

let uploadRunning = false;

function newID() {
    if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
    ) {
        return window.crypto.randomUUID();
    }

    return (
        Date.now().toString(36) +
        "-" +
        Math.random().toString(36).substring(2)
    );
}

let sessionID =
    sessionStorage.getItem("cvent_session_id");

if (!sessionID) {
    sessionID = newID();

    sessionStorage.setItem(
        "cvent_session_id",
        sessionID
    );
}

function formatBytes(bytes) {
    if (!Number.isFinite(bytes) || bytes < 0) {
        return "未知";
    }

    const units = ["B", "KB", "MB", "GB", "TB"];

    let value = bytes;
    let index = 0;

    while (
        value >= 1024 &&
        index < units.length - 1
    ) {
        value /= 1024;
        index++;
    }

    return (
        value.toFixed(index === 0 ? 0 : 2) +
        " " +
        units[index]
    );
}

function pad(value) {
    return String(value).padStart(2, "0");
}

function createUniqueFilename(originalName) {
    const dot = originalName.lastIndexOf(".");

    const base =
        dot > 0
            ? originalName.substring(0, dot)
            : originalName;

    const extension =
        dot > 0
            ? originalName.substring(dot)
            : "";

    const now = new Date();

    const timestamp =
        now.getFullYear() +
        pad(now.getMonth() + 1) +
        pad(now.getDate()) +
        "-" +
        pad(now.getHours()) +
        pad(now.getMinutes()) +
        pad(now.getSeconds());

    return (
        base +
        "_" +
        timestamp +
        "_" +
        newID().substring(0, 8) +
        extension
    );
}

function createNoCacheURL(originalURL) {
    const url = new URL(originalURL);

    url.searchParams.set("_nocache", newID());

    return url.toString();
}

function getPendingRecords() {
    try {
        const records = JSON.parse(
            localStorage.getItem(PENDING_KEY) || "[]"
        );

        return Array.isArray(records)
            ? records
            : [];
    } catch (_) {
        return [];
    }
}

function savePendingRecords(records) {
    localStorage.setItem(
        PENDING_KEY,
        JSON.stringify(records)
    );

    updateUploadStatus();
}

function queueRecord(record) {
    const records = getPendingRecords();

    const alreadyExists = records.some(
        item => item.record_id === record.record_id
    );

    if (!alreadyExists) {
        records.push(record);
        savePendingRecords(records);
    }

    /*
     * 不在這裡呼叫 flushPendingRecords。
     * 紀錄只會保存在 localStorage，
     * 等使用者按下回傳按鈕。
     */
}

function updateUploadStatus(message = "") {
    const count = getPendingRecords().length;

    if (message) {
        uploadStatus.textContent =
            message +
            "｜未上傳紀錄：" +
            count +
            " 筆";

        return;
    }

    if (count === 0) {
        uploadStatus.className = "status success";
        uploadStatus.textContent =
            "目前沒有等待上傳的速度紀錄";
    } else {
        uploadStatus.className = "status";

        uploadStatus.textContent =
            "等待手動回傳 Server 的紀錄：" +
            count +
            " 筆";
    }
}

async function flushPendingRecords() {
    if (uploadRunning) {
        return;
    }

    const records = getPendingRecords();

    if (records.length === 0) {
        updateUploadStatus();
        return;
    }

    uploadRunning = true;
    uploadButton.disabled = true;

    uploadStatus.className = "status";
    updateUploadStatus("正在上傳");

    const sentIDs = new Set(
        records.map(record => record.record_id)
    );

    const controller = new AbortController();

    const timeout = setTimeout(() => {
        controller.abort();
    }, 8000);

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            cache: "no-store",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                records
            }),
            signal: controller.signal
        });

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const remaining =
            getPendingRecords().filter(
                record => {
                    return !sentIDs.has(
                        record.record_id
                    );
                }
            );

        savePendingRecords(remaining);

        uploadStatus.className = "status success";

        updateUploadStatus(
            "成功上傳 " +
            records.length +
            " 筆紀錄"
        );
    } catch (error) {
        console.error(
            "紀錄上傳失敗：",
            error
        );

        let message =
            error.message || String(error);

        if (error.name === "AbortError") {
            message = "連線逾時";
        }

        uploadStatus.className = "status error";

        updateUploadStatus(
            "上傳失敗：" + message
        );
    } finally {
        clearTimeout(timeout);

        uploadRunning = false;
        uploadButton.disabled = false;
    }
}

function saveBlob(blob, filename) {
    const objectURL =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = objectURL;
    link.download = filename;
    link.style.display = "none";

    document.body.appendChild(link);

    link.click();
    link.remove();

    setTimeout(() => {
        URL.revokeObjectURL(objectURL);
    }, 30000);
}

function createBaseRecord(
    file,
    startedAt
) {
    return {
        record_id: newID(),
        session_id: sessionID,
        batch_id: null,

        mode: "individual",
        file_index: file.linkNumber,
        file_name: file.name,
        file_label: file.label,
        source_url: file.url,

        status: "unknown",
        bytes: 0,
        elapsed_ms: 0,
        average_MBps: 0,
        average_mbps: 0,

        started_at: startedAt,
        finished_at: null,

        page_url: location.href,
        user_agent: navigator.userAgent
    };
}

async function downloadAndMeasure(
    file,
    elements
) {
    const {
        button,
        progress,
        status
    } = elements;

    button.disabled = true;
    button.textContent = "下載中…";

    progress.style.display = "block";
    progress.removeAttribute("value");
    progress.removeAttribute("max");

    status.className = "status";
    status.textContent =
        "正在連接下載 Server…";

    const startedAt =
        new Date().toISOString();

    const record =
        createBaseRecord(
            file,
            startedAt
        );

    const startTime = performance.now();

    let receivedBytes = 0;
    let reader = null;

    try {
        const response = await fetch(
            createNoCacheURL(file.url),
            {
                method: "GET",
                mode: "cors",
                cache: "no-store",
                credentials: "omit",
                redirect: "follow"
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " +
                response.status +
                " " +
                response.statusText
            );
        }

        if (!response.body) {
            throw new Error(
                "瀏覽器不支援串流下載"
            );
        }

        const contentLength =
            Number(
                response.headers.get(
                    "Content-Length"
                )
            ) || 0;

        if (contentLength > 0) {
            progress.max = contentLength;
            progress.value = 0;
        }

        reader = response.body.getReader();

        const chunks = [];
        let lastUpdate = 0;

        while (true) {
            const result =
                await reader.read();

            if (result.done) {
                break;
            }

            chunks.push(result.value);

            receivedBytes +=
                result.value.byteLength;

            const currentTime =
                performance.now();

            if (
                currentTime - lastUpdate >= 100
            ) {
                const seconds = Math.max(
                    (
                        currentTime -
                        startTime
                    ) / 1000,
                    0.001
                );

                const MBps =
                    receivedBytes /
                    seconds /
                    1_000_000;

                const Mbps =
                    receivedBytes *
                    8 /
                    seconds /
                    1_000_000;

                if (contentLength > 0) {
                    progress.value =
                        receivedBytes;

                    const percent =
                        receivedBytes /
                        contentLength *
                        100;

                    status.textContent =
                        formatBytes(
                            receivedBytes
                        ) +
                        " / " +
                        formatBytes(
                            contentLength
                        ) +
                        "｜" +
                        percent.toFixed(1) +
                        "%｜" +
                        MBps.toFixed(2) +
                        " MB/s｜" +
                        Mbps.toFixed(2) +
                        " Mbps";
                } else {
                    status.textContent =
                        formatBytes(
                            receivedBytes
                        ) +
                        "｜" +
                        MBps.toFixed(2) +
                        " MB/s｜" +
                        Mbps.toFixed(2) +
                        " Mbps";
                }

                lastUpdate = currentTime;
            }
        }

        const endTime = performance.now();

        const elapsedSeconds = Math.max(
            (
                endTime -
                startTime
            ) / 1000,
            0.001
        );

        const averageMBps =
            receivedBytes /
            elapsedSeconds /
            1_000_000;

        const averageMbps =
            receivedBytes *
            8 /
            elapsedSeconds /
            1_000_000;

        const contentType =
            response.headers.get(
                "Content-Type"
            ) ||
            "application/octet-stream";

        const blob = new Blob(
            chunks,
            {
                type: contentType
            }
        );

        const filename =
            createUniqueFilename(
                file.name
            );

        saveBlob(blob, filename);

        progress.max =
            receivedBytes || 1;

        progress.value =
            receivedBytes || 1;

        record.status = "success";
        record.bytes = receivedBytes;

        record.elapsed_ms = Math.round(
            elapsedSeconds * 1000
        );

        record.average_MBps = Number(
            averageMBps.toFixed(3)
        );

        record.average_mbps = Number(
            averageMbps.toFixed(3)
        );

        record.finished_at =
            new Date().toISOString();

        status.className =
            "status success";

        status.innerHTML =
            "下載完成：" +
            formatBytes(receivedBytes) +
            "<br>" +
            "耗時：" +
            elapsedSeconds.toFixed(2) +
            " 秒<br>" +
            "平均速度：" +
            averageMBps.toFixed(2) +
            " MB/s（" +
            averageMbps.toFixed(2) +
            " Mbps）<br>" +
            "檔名：" +
            filename +
            "<br>" +
            "紀錄已儲存在瀏覽器，尚未上傳至 Server";

        queueRecord(record);

        return record;

    } catch (error) {
        console.error(error);

        const endTime =
            performance.now();

        let message =
            error.message ||
            String(error);

        if (
            message.includes(
                "Failed to fetch"
            ) ||
            message.includes(
                "Load failed"
            )
        ) {
            message =
                "無法讀取檔案，可能是 CORS 或網路連線問題";
        }

        record.status = "failed";
        record.bytes = receivedBytes;

        record.elapsed_ms = Math.round(
            endTime - startTime
        );

        record.finished_at =
            new Date().toISOString();

        record.error = message;

        status.className =
            "status error";

        status.textContent =
            "下載失敗：" +
            message +
            "｜失敗紀錄已儲存在瀏覽器，尚未上傳至 Server";

        queueRecord(record);

        return record;

    } finally {
        if (reader) {
            try {
                reader.releaseLock();
            } catch (_) {
                // 不影響下載結果
            }
        }

        button.disabled = false;
        button.textContent =
            "再次下載及測速";
    }
}

files.forEach(file => {
    const card =
        document.createElement("section");

    card.className = "file-card";

    const fileName =
        document.createElement("div");

    fileName.className = "file-name";

    fileName.textContent =
        file.label +
        "：" +
        file.name;

    const fileURL =
        document.createElement("div");

    fileURL.className = "file-url";
    fileURL.textContent = file.url;

    const button =
        document.createElement("button");

    button.type = "button";
    button.textContent = "下載及測速";

    const progress =
        document.createElement("progress");

    const status =
        document.createElement("div");

    status.className = "status";
    status.textContent = "尚未開始";

    const elements = {
        button,
        progress,
        status
    };

    fileElements.push(elements);

    button.addEventListener(
        "click",
        () => {
            downloadAndMeasure(
                file,
                elements
            );
        }
    );

    card.append(
        fileName,
        fileURL,
        button,
        progress,
        status
    );

    fileList.appendChild(card);
});

uploadButton.addEventListener(
    "click",
    flushPendingRecords
);

resetButton.addEventListener(
    "click",
    () => {
        fileElements.forEach(elements => {
            elements.progress.style.display =
                "none";

            elements.progress.removeAttribute(
                "value"
            );

            elements.progress.removeAttribute(
                "max"
            );

            elements.status.className =
                "status";

            elements.status.textContent =
                "尚未開始";
        });
    }
);

/*
 * 頁面載入時只顯示未上傳紀錄數量。
 *
 * 不會自動呼叫 flushPendingRecords。
 * 不會使用 visibilitychange。
 * 不會使用 sendBeacon。
 *
 * 只有使用者按下「重新上傳未送紀錄」
 * 才會回傳紀錄。
 */
updateUploadStatus();
</script>
</body>
</html>
