<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多機定時同步下載器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 30px; background-color: #f4f7f6; color: #333; }
        .card { background: white; max-width: 400px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .clock { font-size: 32px; font-weight: bold; margin: 15px 0; color: #007bff; }
        input[type="time"] { font-size: 20px; padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; margin: 10px 0; }
        button { font-size: 18px; padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #6c757d; }
        .status { margin-top: 15px; font-size: 16px; font-weight: bold; color: #dc3545; }
    </style>
</head>
<body>

<div class="card">
    <h2>⏰ 自動定時下載器</h2>
    <p>目前手機系統時間：</p>
    <div id="currentTime" class="clock">00:00:00</div>

    <label for="targetTime"><b>設定預計下載時間：</b></label><br>
    <input type="time" id="targetTime" step="1"><br>

    <button id="startBtn" onclick="armTimer()">確認啟動排程</button>

    <div id="status" class="status">狀態：等待設定...</div>
</div>

<script>
    // 兩條下載連結
    const url1 = "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/241e3b3db2cc47e0bb056f054e4532dc.pdf";
    const url2 = "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/1915ccb2f13946f9acffc74f82c529c2.pdf";

    let timerInterval = null;
    let targetTimeString = "";

    // 1. 每秒更新螢幕上的目前時間
    function updateClock() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        
        const currentTimeStr = `${hrs}:${mins}:${secs}`;
        document.getElementById("currentTime").innerText = currentTimeStr;

        // 檢查是否到達設定時間
        if (targetTimeString && currentTimeStr === targetTimeString) {
            triggerDownload();
        }
    }
    setInterval(updateClock, 1000);

    // 2. 按下按鈕，鎖定時間並開始倒數
    function armTimer() {
        const inputVal = document.getElementById("targetTime").value;
        if (!inputVal) {
            alert("請先選擇時間！");
            return;
        }

        // 如果輸入只有 HH:MM，自動補上 :00 秒
        targetTimeString = inputVal.length === 5 ? `${inputVal}:00` : inputVal;

        document.getElementById("status").innerText = `已排程！將在 ${targetTimeString} 自動下載`;
        document.getElementById("status").style.color = "#28a745";
        document.getElementById("startBtn").disabled = true;

        // ⚠️ 重要：預先請求權限，避免瀏覽器在時間到時阻擋彈出視窗
        alert(`排程成功！請保持此網頁開啟，不要關閉螢幕。\n時間到達 ${targetTimeString} 時會自動下載。`);
    }

    // 3. 觸發下載邏輯
    function triggerDownload() {
        document.getElementById("status").innerText = "🚀 時間到！正在觸發下載...";
        document.getElementById("status").style.color = "#007bff";

        // 下載第一個檔案
        downloadFile(url1, "file1.pdf");

        // 延遲 500 毫秒下載第二個檔案，防止瀏覽器阻擋多檔連發
        setTimeout(() => {
            downloadFile(url2, "file2.pdf");
            document.getElementById("status").innerText = "✅ 下載指令已完成發送！";
            targetTimeString = ""; // 重設，避免重複觸發
        }, 500);
    }

    // 動態建立 <a> 標籤強制下載
    function downloadFile(url, fileName) {
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        a.target = "_blank";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
