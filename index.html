<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>檔案下載速度測試</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f3f4f6;
            color: #111827;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang TC",
                "Microsoft JhengHei",
                sans-serif;
        }

        .container {
            width: min(920px, 100%);
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(25px, 5vw, 36px);
        }

        .description {
            margin: 0 0 20px;
            color: #4b5563;
            line-height: 1.7;
        }

        .average-panel {
            margin: 18px 0;
            padding: 16px 18px;
            background: #eff6ff;
            border: 1px solid #93c5fd;
            border-radius: 12px;
        }

        .average-title {
            margin-bottom: 6px;
            color: #1e3a8a;
            font-size: 16px;
            font-weight: 700;
        }

        .average-value {
            color: #1e40af;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.5;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 18px 0;
        }

        .file-card {
            margin: 14px 0;
            padding: 18px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        }

        .file-name {
            margin-bottom: 7px;
            font-size: 18px;
            font-weight: 700;
            word-break: break-all;
        }

        .file-url {
            margin-bottom: 14px;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.5;
            word-break: break-all;
        }

        .file-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            min-height: 46px;
            padding: 10px 18px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .secondary-button {
            background: #374151;
        }

        .secondary-button:hover:not(:disabled) {
            background: #1f2937;
        }

        .save-button {
            display: none;
            background: #047857;
        }

        .save-button:hover:not(:disabled) {
            background: #065f46;
        }

        progress {
            display: none;
            width: 100%;
            height: 19px;
            margin-top: 15px;
        }

        .status {
            min-height: 25px;
            margin-top: 12px;
            color: #374151;
            line-height: 1.6;
            word-break: break-word;
        }

        .success {
            color: #047857;
            font-weight: 600;
        }

        .error {
            color: #dc2626;
            font-weight: 600;
        }

        .upload-panel {
            margin-top: 24px;
            padding: 18px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        }

        .upload-panel-title {
            margin: 0 0 8px;
            font-size: 19px;
            font-weight: 700;
        }

        .upload-panel-description {
            margin: 0;
            color: #4b5563;
            line-height: 1.6;
        }

        .warning {
            margin-top: 20px;
            padding: 14px;
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 10px;
            color: #92400e;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
            }

            .file-card {
                padding: 15px;
            }

            .file-actions {
                display: block;
            }

            button {
                width: 100%;
            }

            .file-actions button + button {
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <h1>檔案下載速度測試</h1>

    <p class="description">
        點擊個別檔案開始下載及測速。每次請求都會加入隨機參數，
        並要求瀏覽器不要使用 HTTP 快取。
        測速完成後可自行選擇是否儲存檔案。
        測速紀錄只會先儲存在此瀏覽器，
        必須按下「上傳紀錄」才會上傳至 Server。
    </p>

    <section class="average-panel">
        <div class="average-title">
            本頁測速平均
        </div>

        <div id="overall-average" class="average-value">
            尚未完成任何測速
        </div>
    </section>

    <div id="file-list"></div>

    <section class="upload-panel">
        <h2 class="upload-panel-title">
            測速紀錄上傳
        </h2>

        <p class="upload-panel-description">
            下載及測速完成後，紀錄會先儲存在此瀏覽器。
            請按下「上傳紀錄」傳送到 Server。
        </p>

        <div id="upload-status" class="status">
            速度紀錄：檢查中……
        </div>

        <div class="toolbar">
            <button
                id="upload-records"
                class="secondary-button"
                type="button"
            >
                上傳紀錄
            </button>

            <button
                id="reset-results"
                class="secondary-button"
                type="button"
            >
                清除畫面結果
            </button>
        </div>
    </section>

    <div class="warning">
        此網頁使用 JavaScript Fetch 讀取外部下載網址。
        如果外部伺服器不允許跨來源存取（CORS），
        瀏覽器可能會阻止測速，並顯示
        「Failed to fetch」或 CORS 錯誤。
    </div>
</div>

<script>
/* =====================================================================
 * 測試及 Server 紀錄設定
 *
 * 以下資料不會顯示於畫面，
 * 但仍會隨測速紀錄傳送至 Server。
 * ===================================================================== */

const BANDWIDTH_LIMIT_MBPS = 12;
const TEST_PROFILE = "wifi-12mbps";

const GRADE_RULES = [
    { minPercent: 75, grade: "佳" },
    { minPercent: 50, grade: "好" },
    { minPercent: 25, grade: "普通" },
    { minPercent: 0,  grade: "差" }
];

/* =====================================================================
 * 下載網址清單
 * ===================================================================== */

const files = [
    {
        linkNumber: 8,
        label: "Link 1",
        name: "Cvent File 8.23 MB",
        saveAs: "Cvent_File_1.pdf",
        url: "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/241e3b3db2cc47e0bb056f054e4532dc.pdf"
    },
    {
        linkNumber: 9,
        label: "Link 2",
        name: "Cvent File 9.73 MB",
        saveAs: "Cvent_File_2.pdf",
        url: "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/1915ccb2f13946f9acffc74f82c529c2.pdf"
    },
    {
        linkNumber: 11,
        label: "Link 3",
        name: "Cvent File (.ai)",
        saveAs: "Cvent_File_3.ai",
        url: "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/25471d1b885b40259ecb57778db9272e.ai"
    },
    {
        linkNumber: 10,
        label: "Cloudflare 20 MB 測速",
        name: "Cloudflare_20MB.bin",
        saveAs: "Cloudflare_20MB.bin",
        url: "https://speed.cloudflare.com/__down?bytes=20000000"
    }
];

/* ===================================================================== */

const API_URL = "/api/download-results";
const PENDING_KEY = "cvent_pending_download_records_v1";

const fileList =
    document.getElementById("file-list");

const uploadStatus =
    document.getElementById("upload-status");

const uploadButton =
    document.getElementById("upload-records");

const resetButton =
    document.getElementById("reset-results");

const overallAverage =
    document.getElementById("overall-average");

const fileElements = [];

/*
 * 儲存本頁成功完成的測速。
 * 此陣列只用來計算畫面平均，不會上傳至 Server。
 */
const completedSpeeds = [];

let uploadRunning = false;

/*
 * 全頁測速鎖。
 *
 * 同一時間只允許一個測速，避免 iOS 同時執行多個 Fetch，
 * 導致其中一個請求被瀏覽器取消。
 */
let downloadRunning = false;

function newID() {
    if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
    ) {
        return window.crypto.randomUUID();
    }

    return (
        Date.now().toString(36) +
        "-" +
        Math.random().toString(36).substring(2)
    );
}

let sessionID =
    sessionStorage.getItem("cvent_session_id");

if (!sessionID) {
    sessionID = newID();

    sessionStorage.setItem(
        "cvent_session_id",
        sessionID
    );
}

function gradeSpeed(averageMbps) {
    const percent =
        averageMbps /
        BANDWIDTH_LIMIT_MBPS *
        100;

    const rule =
        GRADE_RULES.find(
            item => percent >= item.minPercent
        ) ||
        GRADE_RULES[GRADE_RULES.length - 1];

    return {
        percent: Number(percent.toFixed(1)),
        grade: rule.grade
    };
}

function formatBytes(bytes) {
    if (!Number.isFinite(bytes) || bytes < 0) {
        return "未知";
    }

    const units = ["B", "KB", "MB", "GB", "TB"];

    let value = bytes;
    let index = 0;

    while (
        value >= 1024 &&
        index < units.length - 1
    ) {
        value /= 1024;
        index++;
    }

    return (
        value.toFixed(index === 0 ? 0 : 2) +
        " " +
        units[index]
    );
}

function pad(value) {
    return String(value).padStart(2, "0");
}

function createUniqueFilename(originalName) {
    const dot = originalName.lastIndexOf(".");

    const base =
        dot > 0
            ? originalName.substring(0, dot)
            : originalName;

    const extension =
        dot > 0
            ? originalName.substring(dot)
            : "";

    const now = new Date();

    const timestamp =
        now.getFullYear() +
        pad(now.getMonth() + 1) +
        pad(now.getDate()) +
        "-" +
        pad(now.getHours()) +
        pad(now.getMinutes()) +
        pad(now.getSeconds());

    return (
        base +
        "_" +
        timestamp +
        "_" +
        newID().substring(0, 8) +
        extension
    );
}

function createNoCacheURL(originalURL) {
    const url = new URL(originalURL);

    url.searchParams.set(
        "_nocache",
        newID()
    );

    return url.toString();
}

/* =====================================================================
 * 本頁平均速度
 * ===================================================================== */

function updateOverallAverage() {
    if (completedSpeeds.length === 0) {
        overallAverage.textContent =
            "尚未完成任何測速";

        return;
    }

    const totalMbps =
        completedSpeeds.reduce(
            (sum, speed) => sum + speed,
            0
        );

    const averageMbps =
        totalMbps / completedSpeeds.length;

    const averageMBps =
        averageMbps / 8;

    overallAverage.textContent =
        "已完成 " +
        completedSpeeds.length +
        " 次｜平均 " +
        averageMBps.toFixed(2) +
        " MB/s（" +
        averageMbps.toFixed(2) +
        " Mbps）";
}

function addCompletedSpeed(averageMbps) {
    if (
        !Number.isFinite(averageMbps) ||
        averageMbps < 0
    ) {
        return;
    }

    completedSpeeds.push(averageMbps);
    updateOverallAverage();
}

/* =====================================================================
 * 待上傳紀錄
 * ===================================================================== */

function getPendingRecords() {
    try {
        const records = JSON.parse(
            localStorage.getItem(PENDING_KEY) || "[]"
        );

        return Array.isArray(records)
            ? records
            : [];
    } catch (_) {
        return [];
    }
}

function savePendingRecords(records) {
    localStorage.setItem(
        PENDING_KEY,
        JSON.stringify(records)
    );

    updateUploadStatus();
}

function queueRecord(record) {
    const records = getPendingRecords();

    const alreadyExists = records.some(
        item => item.record_id === record.record_id
    );

    if (!alreadyExists) {
        records.push(record);
        savePendingRecords(records);
    }
}

function updateUploadStatus(message = "") {
    const count = getPendingRecords().length;

    if (message) {
        uploadStatus.textContent =
            message +
            "｜未上傳紀錄：" +
            count +
            " 筆";

        return;
    }

    if (count === 0) {
        uploadStatus.className =
            "status success";

        uploadStatus.textContent =
            "目前沒有等待上傳的速度紀錄";
    } else {
        uploadStatus.className =
            "status";

        uploadStatus.textContent =
            "等待手動上傳至 Server 的紀錄：" +
            count +
            " 筆";
    }
}

async function flushPendingRecords() {
    if (uploadRunning) {
        return;
    }

    const records = getPendingRecords();

    if (records.length === 0) {
        updateUploadStatus();
        return;
    }

    uploadRunning = true;
    uploadButton.disabled = true;

    uploadStatus.className = "status";
    updateUploadStatus("正在上傳");

    const sentIDs = new Set(
        records.map(record => record.record_id)
    );

    const controller =
        new AbortController();

    const timeout = setTimeout(() => {
        controller.abort();
    }, 8000);

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            cache: "no-store",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                records
            }),
            signal: controller.signal
        });

        if (!response.ok) {
            const allow =
                response.headers.get("Allow");

            let serverMessage = "";

            try {
                serverMessage =
                    (await response.text()).trim();
            } catch (_) {
                // 無法讀取 Server 回應內容
            }

            if (response.status === 405) {
                throw new Error(
                    "HTTP 405：Server 不允許使用 POST 方法" +
                    (
                        allow
                            ? "（允許方法：" + allow + "）"
                            : ""
                    ) +
                    "。請檢查 /api/download-results 的 Nginx 或後端設定"
                );
            }

            throw new Error(
                "HTTP " +
                response.status +
                (
                    serverMessage
                        ? "：" + serverMessage.substring(0, 200)
                        : ""
                )
            );
        }

        const remaining =
            getPendingRecords().filter(
                record => {
                    return !sentIDs.has(
                        record.record_id
                    );
                }
            );

        savePendingRecords(remaining);

        uploadStatus.className =
            "status success";

        updateUploadStatus(
            "成功上傳 " +
            records.length +
            " 筆紀錄"
        );
    } catch (error) {
        console.error(
            "紀錄上傳失敗：",
            error
        );

        let message =
            error.message || String(error);

        if (error.name === "AbortError") {
            message = "連線逾時";
        }

        uploadStatus.className =
            "status error";

        updateUploadStatus(
            "上傳失敗：" + message
        );
    } finally {
        clearTimeout(timeout);

        uploadRunning = false;
        uploadButton.disabled = false;
    }
}

/* =====================================================================
 * 檔案儲存
 *
 * 測速完成時不會自動打開儲存視窗。
 * 使用者可自行點擊「儲存檔案（可選）」。
 * ===================================================================== */

function clearPreparedFile(elements) {
    if (elements.objectURL) {
        URL.revokeObjectURL(
            elements.objectURL
        );
    }

    elements.objectURL = null;
    elements.downloadFilename = null;

    elements.saveButton.style.display =
        "none";

    elements.saveButton.disabled = true;
}

function prepareFileForSaving(
    elements,
    blob,
    filename
) {
    clearPreparedFile(elements);

    elements.objectURL =
        URL.createObjectURL(blob);

    elements.downloadFilename =
        filename;

    elements.saveButton.disabled = false;

    elements.saveButton.style.display =
        "inline-block";
}

function savePreparedFile(elements) {
    if (
        !elements.objectURL ||
        !elements.downloadFilename
    ) {
        return;
    }

    const link =
        document.createElement("a");

    link.href =
        elements.objectURL;

    link.download =
        elements.downloadFilename;

    link.style.display = "none";

    document.body.appendChild(link);
    link.click();
    link.remove();

    /*
     * 不立即 revoke，避免 Android／iOS 尚未完成
     * 下載處理時，object URL 已被刪除。
     *
     * URL 會在重新測試、清除畫面或離開頁面時釋放。
     */
}

/* =====================================================================
 * 全頁測速鎖
 * ===================================================================== */

function setDownloadButtonsLocked(
    locked,
    activeElements = null
) {
    fileElements.forEach(elements => {
        elements.button.disabled = locked;

        if (locked) {
            if (elements === activeElements) {
                elements.button.textContent =
                    "下載中…";
            } else {
                elements.button.textContent =
                    "等待目前測速完成";
            }
        } else {
            elements.button.textContent =
                elements.hasRun
                    ? "再次下載及測速"
                    : "下載及測速";
        }
    });
}

/* =====================================================================
 * 建立 Server 紀錄
 * ===================================================================== */

function createBaseRecord(
    file,
    startedAt
) {
    return {
        record_id: newID(),
        session_id: sessionID,
        batch_id: null,

        mode: "individual",
        file_index: file.linkNumber,
        file_name: file.name,
        file_label: file.label,
        source_url: file.url,

        status: "unknown",
        bytes: 0,
        elapsed_ms: 0,
        average_MBps: 0,
        average_mbps: 0,

        /*
         * 以下評級資料不顯示於網頁，
         * 但仍會上傳到 Server。
         */
        test_profile: TEST_PROFILE,
        bandwidth_limit_mbps:
            BANDWIDTH_LIMIT_MBPS,
        speed_ratio_percent: null,
        speed_grade: null,

        started_at: startedAt,
        finished_at: null,

        page_url: location.href,
        user_agent: navigator.userAgent
    };
}

/* =====================================================================
 * 下載及測速
 * ===================================================================== */

async function downloadAndMeasure(
    file,
    elements
) {
    /*
     * 若目前已有測速，直接忽略這次點擊。
     * 不建立失敗紀錄。
     */
    if (downloadRunning) {
        return;
    }

    downloadRunning = true;

    setDownloadButtonsLocked(
        true,
        elements
    );

    const {
        progress,
        status
    } = elements;

    /*
     * 如果同一卡片已有上一次測速的暫存檔案，
     * 開始新測速前先釋放。
     */
    clearPreparedFile(elements);

    progress.style.display = "block";
    progress.removeAttribute("value");
    progress.removeAttribute("max");

    status.className = "status";
    status.textContent =
        "正在連接下載 Server…";

    const startedAt =
        new Date().toISOString();

    const record =
        createBaseRecord(
            file,
            startedAt
        );

    const startTime =
        performance.now();

    let receivedBytes = 0;
    let reader = null;

    try {
        const response = await fetch(
            createNoCacheURL(file.url),
            {
                method: "GET",
                mode: "cors",
                cache: "no-store",
                credentials: "omit",
                redirect: "follow"
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " +
                response.status +
                " " +
                response.statusText
            );
        }

        if (!response.body) {
            throw new Error(
                "瀏覽器不支援串流下載"
            );
        }

        const contentLength =
            Number(
                response.headers.get(
                    "Content-Length"
                )
            ) || 0;

        if (contentLength > 0) {
            progress.max = contentLength;
            progress.value = 0;
        }

        reader =
            response.body.getReader();

        const chunks = [];
        let lastUpdate = 0;

        while (true) {
            const result =
                await reader.read();

            if (result.done) {
                break;
            }

            chunks.push(result.value);

            receivedBytes +=
                result.value.byteLength;

            const currentTime =
                performance.now();

            if (
                currentTime - lastUpdate >= 100
            ) {
                const seconds = Math.max(
                    (
                        currentTime -
                        startTime
                    ) / 1000,
                    0.001
                );

                const MBps =
                    receivedBytes /
                    seconds /
                    1_000_000;

                const Mbps =
                    receivedBytes *
                    8 /
                    seconds /
                    1_000_000;

                if (contentLength > 0) {
                    progress.value =
                        receivedBytes;

                    const percent =
                        receivedBytes /
                        contentLength *
                        100;

                    status.textContent =
                        formatBytes(
                            receivedBytes
                        ) +
                        " / " +
                        formatBytes(
                            contentLength
                        ) +
                        "｜" +
                        percent.toFixed(1) +
                        "%｜" +
                        MBps.toFixed(2) +
                        " MB/s｜" +
                        Mbps.toFixed(2) +
                        " Mbps";
                } else {
                    status.textContent =
                        formatBytes(
                            receivedBytes
                        ) +
                        "｜" +
                        MBps.toFixed(2) +
                        " MB/s｜" +
                        Mbps.toFixed(2) +
                        " Mbps";
                }

                lastUpdate = currentTime;
            }
        }

        const endTime =
            performance.now();

        const elapsedSeconds =
            Math.max(
                (
                    endTime -
                    startTime
                ) / 1000,
                0.001
            );

        const averageMBps =
            receivedBytes /
            elapsedSeconds /
            1_000_000;

        const averageMbps =
            receivedBytes *
            8 /
            elapsedSeconds /
            1_000_000;

        /*
         * 評級只寫入 Server 紀錄，
         * 不顯示在網頁。
         */
        const rating =
            gradeSpeed(averageMbps);

        const contentType =
            response.headers.get(
                "Content-Type"
            ) ||
            "application/octet-stream";

        const blob = new Blob(
            chunks,
            {
                type: contentType
            }
        );

        const filename =
            createUniqueFilename(
                file.saveAs || file.name
            );

        /*
         * 只準備檔案，不自動開啟儲存視窗。
         * Android 使用者即使不儲存，也可繼續其他測速。
         */
        prepareFileForSaving(
            elements,
            blob,
            filename
        );

        progress.max =
            receivedBytes || 1;

        progress.value =
            receivedBytes || 1;

        record.status = "success";
        record.bytes = receivedBytes;

        record.elapsed_ms = Math.round(
            elapsedSeconds * 1000
        );

        record.average_MBps = Number(
            averageMBps.toFixed(3)
        );

        record.average_mbps = Number(
            averageMbps.toFixed(3)
        );

        record.speed_ratio_percent =
            rating.percent;

        record.speed_grade =
            rating.grade;

        record.finished_at =
            new Date().toISOString();

        /*
         * 畫面只顯示使用者指定的四項資料。
         */
        status.className =
            "status success";

        status.textContent =
            "下載完成\n" +
            "耗時：" +
            elapsedSeconds.toFixed(2) +
            " 秒\n" +
            "平均速度：" +
            averageMBps.toFixed(2) +
            " MB/s（" +
            averageMbps.toFixed(2) +
            " Mbps）\n" +
            "檔名：" +
            filename;

        /*
         * 讓換行字元顯示為換行。
         */
        status.style.whiteSpace =
            "pre-line";

        /*
         * 本頁平均只加入成功測速，
         * 不會上傳至 Server。
         */
        addCompletedSpeed(
            averageMbps
        );

        queueRecord(record);

        return record;

    } catch (error) {
        console.error(error);

        const endTime =
            performance.now();

        let message =
            error.message ||
            String(error);

        if (
            message.includes(
                "Failed to fetch"
            ) ||
            message.includes(
                "Load failed"
            )
        ) {
            message =
                "無法讀取檔案，可能是 CORS 或網路連線問題";
        }

        record.status = "failed";
        record.bytes = receivedBytes;

        record.elapsed_ms = Math.round(
            endTime - startTime
        );

        record.finished_at =
            new Date().toISOString();

        record.error = message;

        status.style.whiteSpace =
            "normal";

        status.className =
            "status error";

        status.textContent =
            "下載失敗：" + message;

        queueRecord(record);

        return record;

    } finally {
        if (reader) {
            try {
                reader.releaseLock();
            } catch (_) {
                // 不影響下載結果
            }
        }

        elements.hasRun = true;

        downloadRunning = false;

        setDownloadButtonsLocked(false);
    }
}

/* =====================================================================
 * 建立檔案卡片
 * ===================================================================== */

files.forEach(file => {
    const card =
        document.createElement("section");

    card.className = "file-card";

    const fileName =
        document.createElement("div");

    fileName.className = "file-name";

    fileName.textContent =
        file.label +
        "：" +
        file.name;

    const fileURL =
        document.createElement("div");

    fileURL.className = "file-url";
    fileURL.textContent = file.url;

    const actions =
        document.createElement("div");

    actions.className = "file-actions";

    const button =
        document.createElement("button");

    button.type = "button";
    button.textContent =
        "下載及測速";

    const saveButton =
        document.createElement("button");

    saveButton.type = "button";
    saveButton.className =
        "save-button";

    saveButton.textContent =
        "儲存檔案（可選）";

    saveButton.disabled = true;

    const progress =
        document.createElement("progress");

    const status =
        document.createElement("div");

    status.className = "status";
    status.textContent = "尚未開始";

    const elements = {
        button,
        saveButton,
        progress,
        status,

        hasRun: false,
        objectURL: null,
        downloadFilename: null
    };

    fileElements.push(elements);

    button.addEventListener(
        "click",
        () => {
            downloadAndMeasure(
                file,
                elements
            );
        }
    );

    saveButton.addEventListener(
        "click",
        () => {
            savePreparedFile(elements);
        }
    );

    actions.append(
        button,
        saveButton
    );

    card.append(
        fileName,
        fileURL,
        actions,
        progress,
        status
    );

    fileList.appendChild(card);
});

/* =====================================================================
 * 按鈕事件
 * ===================================================================== */

uploadButton.addEventListener(
    "click",
    flushPendingRecords
);

resetButton.addEventListener(
    "click",
    () => {
        /*
         * 測速進行中不執行清除，避免破壞目前畫面狀態。
         */
        if (downloadRunning) {
            return;
        }

        fileElements.forEach(elements => {
            clearPreparedFile(elements);

            elements.progress.style.display =
                "none";

            elements.progress.removeAttribute(
                "value"
            );

            elements.progress.removeAttribute(
                "max"
            );

            elements.status.style.whiteSpace =
                "normal";

            elements.status.className =
                "status";

            elements.status.textContent =
                "尚未開始";

            elements.hasRun = false;

            elements.button.textContent =
                "下載及測速";
        });

        /*
         * 只清除本頁平均。
         * 不會刪除 localStorage 中等待上傳的紀錄。
         */
        completedSpeeds.length = 0;
        updateOverallAverage();
    }
);

/*
 * 離開頁面時釋放所有 Blob object URL。
 */
window.addEventListener(
    "pagehide",
    () => {
        fileElements.forEach(elements => {
            if (elements.objectURL) {
                URL.revokeObjectURL(
                    elements.objectURL
                );

                elements.objectURL = null;
            }
        });
    }
);

updateOverallAverage();
updateUploadStatus();
</script>
</body>
</html>
