<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多機定時同步下載器 (含耗時統計)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 25px; background: #f4f7f6; color: #333; }
        .card { background: white; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .clock { font-size: 32px; font-weight: bold; margin: 10px 0; color: #007bff; }
        input[type="time"] { font-size: 20px; padding: 6px; margin: 10px 0; }
        .btn { font-size: 16px; padding: 10px 20px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px 0; width: 100%; }
        .btn-test { background: #6c757d; }
        .btn-arm { background: #28a745; }
        .btn:disabled { background: #cccccc; }
        .status { margin-top: 15px; font-size: 15px; font-weight: bold; color: #007bff; }
        .log-box { font-size: 13px; color: #333; text-align: left; background: #eef; padding: 12px; border-radius: 6px; margin-top: 15px; max-height: 180px; overflow-y: auto; line-height: 1.5; }
        .highlight { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>⏰ 多機定時同步下載器</h2>
    <div id="currentTime" class="clock">00:00:00</div>

    <label for="targetTime"><b>設定預計下載時間：</b></label><br>
    <input type="time" id="targetTime" step="1"><br>
    <button id="startBtn" class="btn btn-arm" onclick="armTimer()">確認啟動排程</button>

    <div id="status" class="status">狀態：等待設定時間...</div>

    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

    <button class="btn btn-test" onclick="executeDownload()">（可選）測試下載與測速</button>

    <div class="log-box" id="logBox">
        <b>📝 下載記錄與耗時：</b><br>
        (等待啟動...)
    </div>
</div>

<script>
    const url1 = "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/241e3b3db2cc47e0bb056f054e4532dc.pdf";
    const url2 = "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/1915ccb2f13946f9acffc74f82c529c2.pdf";

    let targetTimeString = "";

    // 1. 每秒更新時鐘
    function updateClock() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        const currentTimeStr = `${hrs}:${mins}:${secs}`;
        document.getElementById("currentTime").innerText = currentTimeStr;

        if (targetTimeString && currentTimeStr === targetTimeString) {
            triggerDownload();
        }
    }
    setInterval(updateClock, 1000);

    // 2. 隨機檔名生成器
    function generateRandomFileName(prefix = "file") {
        const now = new Date();
        const dateStr = now.getFullYear() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0') + "_" +
            String(now.getHours()).padStart(2, '0') +
            String(now.getMinutes()).padStart(2, '0') +
            String(now.getSeconds()).padStart(2, '0');
        
        const randomStr = Math.random().toString(36).substring(2, 6);
        return `${prefix}_${dateStr}_${randomStr}.pdf`;
    }

    // 3. 設定排程時間
    function armTimer() {
        const inputVal = document.getElementById("targetTime").value;
        if (!inputVal) return alert("請先選擇時間！");
        targetTimeString = inputVal.length === 5 ? `${inputVal}:00` : inputVal;

        document.getElementById("status").innerText = `已排程！將在 ${targetTimeString} 自動下載`;
        document.getElementById("status").style.color = "#28a745";
        document.getElementById("startBtn").disabled = true;
    }

    // 4. 到點觸發
    function triggerDownload() {
        document.getElementById("status").innerText = "🚀 時間到！發起下載並計算耗時...";
        document.getElementById("status").style.color = "#007bff";
        executeDownload();
        targetTimeString = "";
    }

    // 5. 獨立發起單檔下載並精準計算該檔耗時
    async function fetchAndSaveWithTiming(fileUrl, fileName) {
        const startTime = performance.now(); // 紀錄開始毫秒數
        
        const response = await fetch(fileUrl);
        const blob = await response.blob();
        
        const endTime = performance.now(); // 紀錄完成毫秒數
        const durationSec = ((endTime - startTime) / 1000).toFixed(2); // 計算耗時秒數（保留兩位小數）

        // 儲存檔案到手機
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);

        return { fileName, durationSec, size: blob.size };
    }

    // 6. 核心執行：平行發起下載並顯示總耗時
    async function executeDownload() {
        const fileName1 = generateRandomFileName("pdfA");
        const fileName2 = generateRandomFileName("pdfB");

        document.getElementById("logBox").innerHTML = `
            <b>📝 下載記錄與耗時：</b><br>
            ⏳ 下載中，請稍候...
        `;

        const totalStartTime = performance.now();

        try {
            // 同時平行發起兩個下載任務
            const [res1, res2] = await Promise.all([
                fetchAndSaveWithTiming(url1, fileName1),
                fetchAndSaveWithTiming(url2, fileName2)
            ]);

            const totalEndTime = performance.now();
            const totalDurationSec = ((totalEndTime - totalStartTime) / 1000).toFixed(2);

            // 更新介面顯示耗時
            document.getElementById("logBox").innerHTML = `
                <b>📝 下載成功耗時統計：</b><br>
                📄 檔1 (${res1.fileName})：<span class="highlight">${res1.durationSec} 秒</span><br>
                📄 檔2 (${res2.fileName})：<span class="highlight">${res2.durationSec} 秒</span><br>
                ⏱️ <b>平行總耗時：<span class="highlight">${totalDurationSec} 秒</span></b>
            `;

            document.getElementById("status").innerText = "✅ 下載完成！";
        } catch (err) {
            console.error(err);
            document.getElementById("logBox").innerHTML = `❌ 下載失敗或遭跨域阻擋。`;
        }
    }
</script>

</body>
</html>
