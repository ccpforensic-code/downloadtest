<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多機定時同步下載器 (持續下載版)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; background: #f4f7f6; color: #333; }
        .card { background: white; max-width: 540px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .clock { font-size: 32px; font-weight: bold; margin: 5px 0; color: #007bff; }
        .time-sync-info { font-size: 12px; color: #28a745; margin-bottom: 10px; font-weight: bold; }
        input[type="time"], input[type="number"] { font-size: 18px; padding: 6px; margin: 5px 0; text-align: center; }
        input[type="number"] { width: 90px; }
        .btn { font-size: 15px; padding: 10px 15px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px 0; width: 100%; transition: 0.2s; }
        .btn-arm-7 { background: #28a745; }
        .btn-arm-bench { background: #6f42c1; }
        .btn-test { background: #6c757d; }
        .btn-bench { background: #17a2b8; }
        .btn:disabled { background: #cccccc; cursor: not-allowed; }
        .status { margin-top: 15px; font-size: 15px; font-weight: bold; color: #007bff; }
        .log-box { font-size: 12px; color: #333; text-align: left; background: #eef; padding: 12px; border-radius: 6px; margin-top: 15px; max-height: 350px; overflow-y: auto; line-height: 1.6; }
        .log-entry { padding: 6px 0; border-bottom: 1px dashed #ccc; }
        .highlight { color: #d9534f; font-weight: bold; }
        .speed { color: #007bff; font-weight: bold; }
        .bench-tag { background: #17a2b8; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .section-title { font-size: 14px; font-weight: bold; margin-top: 12px; margin-bottom: 5px; color: #555; text-align: left; }
        .setting-row { margin: 8px 0; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>⏰ 多機定時同步下載器</h2>
    <div id="currentTime" class="clock">00:00:00</div>
    <div id="syncStatus" class="time-sync-info">⏳ 正在與香港標準時間對時...</div>

    <div class="setting-row">
        <label for="targetTime"><b>預計下載時間 (HKT)：</b></label><br>
        <input type="time" id="targetTime" step="1">
    </div>

    <div class="setting-row">
        <label for="durationInput"><b>7個檔案持續下載時間 (秒)：</b></label><br>
        <input type="number" id="durationInput" value="10" min="1" max="300"> 秒
    </div>

    <div class="section-title">📅 排程任務選擇：</div>
    <button id="start7Btn" class="btn btn-arm-7" onclick="armTimer('7files')">🟢 排程下載：7 個 .ai 檔案 (持續模式)</button>
    <button id="startBenchBtn" class="btn btn-arm-bench" onclick="armTimer('bench25m')">🟣 排程下載：獨立測試網路極速 (25MB)</button>

    <div id="status" class="status">狀態：等待設定時間...</div>

    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

    <div class="section-title">🧪 獨立手動測試區：</div>
    <button class="btn btn-bench" onclick="runBenchmark()">⚡ 獨立測試網路極速 (25MB)</button>
    <button class="btn btn-test" onclick="executeDownload7Loop()">（可選）手動觸發 7 檔案持續下載</button>

    <div class="log-box">
        <b>📝 下載記錄與速率分析 (最新在最上)：</b>
        <div id="logContainer">
            <div style="color: #888;">(等待啟動...)</div>
        </div>
    </div>
</div>

<script>
    const benchmarkInstallerUrl = "https://speed.cloudflare.com/__down?bytes=25000000";

    const fileUrls = [
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/25471d1b885b40259ecb57778db9272e.ai",
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/7d91438e5a634cef9433396b66174af8.ai",
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/8261c18c11e5423aa251ffde02edec2e.ai",
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/d936be7a88d549f3bfa7388c09f3868b.ai",
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/409adf45fd48497abd4609d995dec523.ai",
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/661b4023226143729514b23c34f5b2b0.ai",
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/fd0dba4d73ae4225bce3d445ee6dd1f6.ai"
    ];

    let targetTimeString = "";
    let scheduledTaskMode = ""; // '7files' 或 'bench25m'
    let timeOffsetOffsetMs = 0;

    // 歷史紀錄置頂輔助函式
    function prependLog(htmlContent) {
        const container = document.getElementById("logContainer");
        // 若只有預設文字則清空
        if (container.innerText.includes("(等待啟動...)")) {
            container.innerHTML = "";
        }
        const newDiv = document.createElement("div");
        newDiv.className = "log-entry";
        newDiv.innerHTML = htmlContent;
        container.insertBefore(newDiv, container.firstChild);
    }

    // 🌐 香港標準時間校正
    async function syncTimeWithHKT() {
        const syncElem = document.getElementById("syncStatus");
        const timeEndpoints = [
            "https://timeapi.io/api/time/current/zone?timeZone=Asia/Hong_Kong",
            "https://worldtimeapi.org/api/timezone/Asia/Hong_Kong"
        ];

        let success = false;
        for (const endpoint of timeEndpoints) {
            try {
                const startReq = performance.now();
                const response = await fetch(endpoint, { cache: "no-store" });
                if (!response.ok) continue;
                
                const data = await response.json();
                const endReq = performance.now();
                const networkLatency = (endReq - startReq) / 2;

                let serverMs = 0;
                if (data.dateTime) serverMs = new Date(data.dateTime).getTime();
                else if (data.datetime) serverMs = new Date(data.datetime).getTime();

                if (serverMs > 0) {
                    timeOffsetOffsetMs = (serverMs + networkLatency) - Date.now();
                    success = true;
                    break;
                }
            } catch (e) {}
        }

        if (!success) {
            try {
                const startReq = performance.now();
                const response = await fetch("https://www.cloudflare.com/cdn-cgi/trace", { cache: "no-store" });
                const text = await response.text();
                const endReq = performance.now();
                
                const tsMatch = text.match(/ts=(.+)/);
                if (tsMatch && tsMatch[1]) {
                    const serverMs = parseFloat(tsMatch[1]) * 1000;
                    const networkLatency = (endReq - startReq) / 2;
                    timeOffsetOffsetMs = (serverMs + networkLatency) - Date.now();
                    success = true;
                }
            } catch (e) {}
        }

        if (success) {
            const offsetSec = (timeOffsetOffsetMs / 1000).toFixed(2);
            syncElem.innerText = `✅ 已對齊香港標準時間 (機時誤差: ${offsetSec > 0 ? '+' : ''}${offsetSec}秒)`;
            syncElem.style.color = "#28a745";
        } else {
            syncElem.innerText = "⚠️ 網路對時失敗，目前使用裝置本機時間";
            syncElem.style.color = "#dc3545";
        }
    }

    function updateClock() {
        const correctedNow = new Date(Date.now() + timeOffsetOffsetMs);
        
        const hrs = String(correctedNow.getHours()).padStart(2, '0');
        const mins = String(correctedNow.getMinutes()).padStart(2, '0');
        const secs = String(correctedNow.getSeconds()).padStart(2, '0');
        const currentTimeStr = `${hrs}:${mins}:${secs}`;
        
        document.getElementById("currentTime").innerText = currentTimeStr;

        if (targetTimeString && currentTimeStr === targetTimeString) {
            triggerDownload();
        }
    }

    syncTimeWithHKT();
    setInterval(updateClock, 1000);

    function generateRandomFileName(prefix, index = "") {
        const now = new Date(Date.now() + timeOffsetOffsetMs);
        const dateStr = now.getFullYear() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0') + "_" +
            String(now.getHours()).padStart(2, '0') +
            String(now.getMinutes()).padStart(2, '0') +
            String(now.getSeconds()).padStart(2, '0');
        
        const randomStr = Math.random().toString(36).substring(2, 6);
        return `${prefix}${index ? index + '_' : ''}${dateStr}_${randomStr}`;
    }

    function formatBytes(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    function armTimer(mode) {
        const inputVal = document.getElementById("targetTime").value;
        if (!inputVal) return alert("請先選擇時間！");
        targetTimeString = inputVal.length === 5 ? `${inputVal}:00` : inputVal;
        scheduledTaskMode = mode;

        const duration = document.getElementById("durationInput").value || 10;
        const modeText = mode === '7files' ? `【7個檔案持續 ${duration} 秒下載】` : "【獨立測試網路極速 (25MB)】";

        document.getElementById("status").innerText = `已排程！將在 ${targetTimeString} (HKT) 執行 ${modeText}`;
        document.getElementById("status").style.color = "#28a745";
        
        document.getElementById("start7Btn").disabled = true;
        document.getElementById("startBenchBtn").disabled = true;
    }

    function triggerDownload() {
        if (scheduledTaskMode === '7files') {
            document.getElementById("status").innerText = "🚀 時間到！開始持續下載 7 個檔案...";
            document.getElementById("status").style.color = "#007bff";
            executeDownload7Loop();
        } else if (scheduledTaskMode === 'bench25m') {
            document.getElementById("status").innerText = "🚀 時間到！開始執行極速 25MB 下載...";
            document.getElementById("status").style.color = "#6f42c1";
            runBenchmark();
        }
        targetTimeString = "";
        scheduledTaskMode = "";
    }

    async function fetchAndSaveSingle(fileUrl, fileName, triggerBrowserSave = true) {
        const startTime = performance.now();
        const urlsToTry = [
            `${fileUrl}${fileUrl.includes('?') ? '&' : '?'}nocache=${Date.now()}_${Math.random().toString(36).substring(2, 7)}`,
            `https://corsproxy.io/?${encodeURIComponent(fileUrl)}`
        ];

        for (let i = 0; i < urlsToTry.length; i++) {
            try {
                const target = urlsToTry[i];
                const response = await fetch(target, { cache: "no-store" });
                if (!response.ok) continue;
                
                const blob = await response.blob();
                if (blob.size === 0) continue;

                const endTime = performance.now();
                const durationSec = (endTime - startTime) / 1000;
                
                const bytes = blob.size;
                const sizeFormatted = formatBytes(bytes);
                const mbps = durationSec > 0 ? ((bytes * 8) / (1000000 * durationSec)).toFixed(2) : "0.00";

                if (triggerBrowserSave) {
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = blobUrl;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
                }

                return {
                    success: true,
                    fileName,
                    bytes,
                    sizeFormatted,
                    durationSec: durationSec.toFixed(2),
                    mbps
                };
            } catch (err) {}
        }

        if (triggerBrowserSave) {
            const a = document.createElement("a");
            a.href = fileUrl;
            a.target = "_blank";
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        return { success: false, fileName };
    }

    // 獨立測試網路極速 (25MB)
    async function runBenchmark() {
        document.getElementById("status").innerText = "⏳ 正在測量網路極速 (25MB)...";

        const benchRes = await fetchAndSaveSingle(benchmarkInstallerUrl, "speedtest_25mb.bin", true);
        const timeStr = new Date().toLocaleTimeString();

        if (benchRes.success) {
            prependLog(`
                <span class="bench-tag">25MB 極速測試 [${timeStr}]</span><br>
                📦 檔案大小：<b>${benchRes.sizeFormatted}</b> | 耗時：<span class="highlight">${benchRes.durationSec} 秒</span><br>
                🚀 <b>極速上限：<span class="speed">${benchRes.mbps} Mbps</span></b>
            `);
            document.getElementById("status").innerText = "✅ 25MB 極速測試完成！";
        } else {
            prependLog(`❌ [${timeStr}] 25MB 極速測試失敗，已觸發瀏覽器原生存取。`);
            document.getElementById("status").innerText = "⚠️ 測試完成 (觸發原生下載)";
        }
        
        document.getElementById("start7Btn").disabled = false;
        document.getElementById("startBenchBtn").disabled = false;
    }

    // 7個檔案持續時間下載 (極短間隔模式)
    async function executeDownload7Loop() {
        const durationSec = parseInt(document.getElementById("durationInput").value) || 10;
        const endTimeStamp = Date.now() + (durationSec * 1000);
        const startTimeStr = new Date().toLocaleTimeString();

        document.getElementById("status").innerText = `👉 正在執行 ${durationSec} 秒持續下載中...`;

        let downloadedCount = 0;
        let totalBytes = 0;
        let fileIndex = 0;
        const loopStartTime = performance.now();

        while (Date.now() < endTimeStamp) {
            const currentUrl = fileUrls[fileIndex % fileUrls.length];
            const fileName = generateRandomFileName("file", (fileIndex % 7) + 1) + ".ai";
            
            const res = await fetchAndSaveSingle(currentUrl, fileName, true);
            
            if (res.success) {
                totalBytes += res.bytes;
            }
            downloadedCount++;
            fileIndex++;

            // 短間隔 (30ms - 60ms 隨機極微微延遲)
            const shortDelay = Math.floor(Math.random() * 30) + 30;
            await sleep(shortDelay);
        }

        const loopEndTime = performance.now();
        const actualDurationSec = (loopEndTime - loopStartTime) / 1000;
        const totalSizeFormatted = formatBytes(totalBytes);
        const avgMbps = actualDurationSec > 0 ? ((totalBytes * 8) / (1000000 * actualDurationSec)).toFixed(2) : "0.00";

        prependLog(`
            <b>🔄 7檔案持續下載結果 [啟動時間 ${startTimeStr}]</b><br>
            ⏱️ 設定持續時間：${durationSec} 秒 (實際耗時 ${actualDurationSec.toFixed(2)} 秒)<br>
            📥 成功下載次數：<b>${downloadedCount} 次</b><br>
            📊 總數據流量：<b>${totalSizeFormatted}</b><br>
            🚀 <b>平均下載速率：<span class="speed">${avgMbps} Mbps</span></b>
        `);

        document.getElementById("status").innerText = `✅ ${durationSec} 秒持續下載任務完成！`;
        
        document.getElementById("start7Btn").disabled = false;
        document.getElementById("startBenchBtn").disabled = false;
    }
</script>

</body>
</html>
