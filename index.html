<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多機定時同步下載器 (隨機檔名版)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 25px; background: #f4f7f6; color: #333; }
        .card { background: white; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .clock { font-size: 32px; font-weight: bold; margin: 10px 0; color: #007bff; }
        input[type="time"] { font-size: 20px; padding: 6px; margin: 10px 0; }
        .btn { font-size: 16px; padding: 10px 20px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px 0; width: 100%; }
        .btn-test { background: #ff9800; }
        .btn-arm { background: #28a745; }
        .btn:disabled { background: #6c757d; }
        .status { margin-top: 15px; font-size: 15px; font-weight: bold; color: #dc3545; }
        .log-box { font-size: 12px; color: #555; text-align: left; background: #eef; padding: 10px; border-radius: 6px; margin-top: 15px; max-height: 120px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="card">
    <h2>⏰ 多機定時同步下載器</h2>
    <div id="currentTime" class="clock">00:00:00</div>

    <!-- 步驟 1：授權按鈕 -->
    <button class="btn btn-test" onclick="testDownloadPermission()">步驟 1：點此允許多檔案下載權限</button>
    
    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

    <!-- 步驟 2：排程時間設定 -->
    <label for="targetTime"><b>步驟 2：設定預計下載時間：</b></label><br>
    <input type="time" id="targetTime" step="1"><br>
    <button id="startBtn" class="btn btn-arm" onclick="armTimer()">步驟 3：確認啟動排程</button>

    <div id="status" class="status">狀態：請先進行步驟 1 授權</div>

    <div class="log-box" id="logBox">
        <b>📝 檔名生成記錄：</b><br>
        (等待啟動...)
    </div>
</div>

<script>
    const url1 = "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/241e3b3db2cc47e0bb056f054e4532dc.pdf";
    const url2 = "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/1915ccb2f13946f9acffc74f82c529c2.pdf";

    let targetTimeString = "";

    // 1. 每秒更新時鐘
    function updateClock() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        const currentTimeStr = `${hrs}:${mins}:${secs}`;
        document.getElementById("currentTime").innerText = currentTimeStr;

        if (targetTimeString && currentTimeStr === targetTimeString) {
            triggerDownload();
        }
    }
    setInterval(updateClock, 1000);

    // 2. 隨機檔名生成器 (格式：doc_年月日_時分秒_隨機碼4位.pdf)
    function generateRandomFileName(prefix = "file") {
        const now = new Date();
        const dateStr = now.getFullYear() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0') + "_" +
            String(now.getHours()).padStart(2, '0') +
            String(now.getMinutes()).padStart(2, '0') +
            String(now.getSeconds()).padStart(2, '0');
        
        // 產生 4 位數英文數字隨機碼
        const randomStr = Math.random().toString(36).substring(2, 6);
        
        return `${prefix}_${dateStr}_${randomStr}.pdf`;
    }

    // 3. 測試授權按鈕
    function testDownloadPermission() {
        alert("即將進行下載測試，請在瀏覽器跳出提示時選擇「允許」或「永遠允許」。");
        executeDownload();
        document.getElementById("status").innerText = "已完成授權測試！請設定步驟 2 時間";
        document.getElementById("status").style.color = "#007bff";
    }

    // 4. 設定時間排程
    function armTimer() {
        const inputVal = document.getElementById("targetTime").value;
        if (!inputVal) return alert("請先選擇時間！");
        targetTimeString = inputVal.length === 5 ? `${inputVal}:00` : inputVal;

        document.getElementById("status").innerText = `已排程！將在 ${targetTimeString} 自動下載`;
        document.getElementById("status").style.color = "#28a745";
        document.getElementById("startBtn").disabled = true;
    }

    // 5. 到點觸發
    function triggerDownload() {
        document.getElementById("status").innerText = "🚀 時間到！正在自動下載...";
        document.getElementById("status").style.color = "#007bff";
        executeDownload();
        targetTimeString = ""; // 防止重複觸發
    }

    // 6. 執行下載並綁定「動態隨機檔名」
    function executeDownload() {
        const fileName1 = generateRandomFileName("pdfA");
        const fileName2 = generateRandomFileName("pdfB");

        // 記錄到畫面上方便對照
        document.getElementById("logBox").innerHTML = `
            <b>📝 檔名生成記錄：</b><br>
            檔1: ${fileName1}<br>
            檔2: ${fileName2}
        `;

        // 觸發下載 1
        downloadFile(url1, fileName1);

        // 延遲 800ms 觸發下載 2
        setTimeout(() => {
            downloadFile(url2, fileName2);
        }, 800);
    }

    // 利用 HTML5 download 屬性強制給予新檔名
    function downloadFile(url, customFileName) {
        const a = document.createElement("a");
        a.href = url;
        a.download = customFileName; // 關鍵：覆寫伺服器原始檔名
        a.target = "_blank";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
