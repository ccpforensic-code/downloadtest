<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>檔案下載速度測試</title>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: #f3f4f6;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        .container { width: min(920px, 100%); margin: 0 auto; }
        h1 { margin: 0 0 10px; font-size: clamp(25px, 5vw, 36px); }
        .description { margin: 0 0 20px; color: #4b5563; line-height: 1.7; }
        .average-panel {
            margin: 18px 0;
            padding: 16px 18px;
            background: #eff6ff;
            border: 1px solid #93c5fd;
            border-radius: 12px;
        }
        .average-title { margin-bottom: 6px; color: #1e3a8a; font-size: 16px; font-weight: 700; }
        .average-value { color: #1e40af; font-size: 18px; font-weight: 700; line-height: 1.5; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
        .file-card {
            margin: 14px 0;
            padding: 18px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .file-name { margin-bottom: 7px; font-size: 18px; font-weight: 700; word-break: break-all; }
        .file-url { margin-bottom: 14px; color: #6b7280; font-size: 12px; line-height: 1.5; word-break: break-all; }
        .file-actions { display: flex; flex-wrap: wrap; gap: 10px; }
        button {
            min-height: 46px;
            padding: 10px 18px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover:not(:disabled) { background: #1d4ed8; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .secondary-button { background: #374151; }
        .secondary-button:hover:not(:disabled) { background: #1f2937; }
        .save-button { display: none; background: #047857; }
        .save-button:hover:not(:disabled) { background: #065f46; }
        .upload-button {
            background: #dc2626;
        }
        .upload-button:hover:not(:disabled) {
            background: #b91c1c;
        }
        .upload-button.success {
            background: #059669;
        }
        .upload-button.success:hover:not(:disabled) {
            background: #047857;
        }
        progress { display: none; width: 100%; height: 19px; margin-top: 15px; }
        .status { min-height: 25px; margin-top: 12px; color: #374151; line-height: 1.6; word-break: break-word; }
        .success { color: #047857; font-weight: 600; }
        .error { color: #dc2626; font-weight: 600; }
        .warning { color: #92400e; font-weight: 600; }
        .info { color: #1e40af; font-weight: 600; }
        .upload-panel {
            margin-top: 24px;
            padding: 18px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .upload-panel-title { margin: 0 0 8px; font-size: 19px; font-weight: 700; }
        .upload-panel-description { margin: 0; color: #4b5563; line-height: 1.6; }
        .api-info {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 14px;
        }
        .api-info.success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
        .api-info.warning { background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; }
        .api-info.error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
        .warning-box {
            margin-top: 20px;
            padding: 14px;
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 10px;
            color: #92400e;
            line-height: 1.6;
        }
        .method-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            align-items: center;
        }
        .method-selector label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .method-selector input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            body { padding: 14px; }
            .file-card { padding: 15px; }
            .file-actions { display: block; }
            button { width: 100%; }
            .file-actions button + button { margin-top: 10px; }
            .method-selector { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>檔案下載速度測試</h1>

    <p class="description">
        點擊個別檔案開始下載及測速。每次請求都會加入隨機參數，
        並要求瀏覽器不要使用 HTTP 快取。
        測速完成後可自行選擇是否儲存檔案。
        測速紀錄只會先儲存在此瀏覽器，
        必須按下「上傳紀錄」才會上傳至 Server。
    </p>

    <div class="warning-box">
        <strong>💡 建議：</strong><br>
        為獲得最佳體驗，請使用內聯網地址訪問：
        <code style="background:#fff;padding:2px 8px;border-radius:4px;display:inline-block;margin-top:4px;">
            http://923test.local/index.html
        </code>
    </div>

    <section class="average-panel">
        <div class="average-title">本頁測速平均</div>
        <div id="overall-average" class="average-value">尚未完成任何測速</div>
    </section>

    <div id="file-list"></div>

    <section class="upload-panel">
        <h2 class="upload-panel-title">測速紀錄上傳</h2>
        <p class="upload-panel-description">
            下載及測速完成後，紀錄會先儲存在此瀏覽器。
            請按下「上傳紀錄」傳送到 Server。
        </p>

        <div class="method-selector">
            <span style="font-weight:600;margin-right:5px;">上傳方式：</span>
            <label>
                <input type="radio" name="upload-method" value="beacon" checked>
                Beacon (推薦)
            </label>
            <label>
                <input type="radio" name="upload-method" value="image">
                Image GET (繞過 CORS)
            </label>
            <label>
                <input type="radio" name="upload-method" value="iframe">
                iframe Form (無 CORS)
            </label>
        </div>

        <div id="upload-status" class="status">速度紀錄：檢查中……</div>
        <div class="toolbar">
            <button id="upload-records" class="upload-button" type="button">📤 上傳紀錄</button>
            <button id="reset-results" class="secondary-button" type="button">清除畫面結果</button>
        </div>
    </section>

    <div id="api-info" class="api-info warning">連接狀態：偵測中……</div>
</div>

<script>
/* =====================================================================
 * 設定
 * ===================================================================== */

const BANDWIDTH_LIMIT_MBPS = 12;
const TEST_PROFILE = "wifi-12mbps";

const GRADE_RULES = [
    { minPercent: 75, grade: "佳" },
    { minPercent: 50, grade: "好" },
    { minPercent: 25, grade: "普通" },
    { minPercent: 0,  grade: "差" }
];

/* =====================================================================
 * API 網址設定
 * ===================================================================== */

// 自動檢測當前環境
const currentHost = window.location.hostname;

// 如果在內聯網，使用相對路徑
const isIntranet = currentHost === '923test.local' || 
                   currentHost === 'localhost' || 
                   currentHost === '127.0.0.1' ||
                   /^192\.168\./.test(currentHost) ||
                   /^10\./.test(currentHost) ||
                   /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(currentHost);

function getAPIUrl() {
    if (isIntranet) {
        return '/api/download-results';
    }
    // 從 GitHub Pages 訪問，使用完整網址
    return 'http://923test.local/api/download-results';
}

function getHealthUrl() {
    if (isIntranet) {
        return '/api/health';
    }
    return 'http://923test.local/api/health';
}

/* =====================================================================
 * 下載網址清單
 * ===================================================================== */

const files = [
    {
        linkNumber: 8,
        label: "Link 1",
        name: "Cvent File 8.23 MB",
        saveAs: "Cvent_File_1.pdf",
        url: "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/241e3b3db2cc47e0bb056f054e4532dc.pdf"
    },
    {
        linkNumber: 9,
        label: "Link 2",
        name: "Cvent File 9.73 MB",
        saveAs: "Cvent_File_2.pdf",
        url: "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/1915ccb2f13946f9acffc74f82c529c2.pdf"
    },
    {
        linkNumber: 11,
        label: "Link 3",
        name: "Cvent File (.ai)",
        saveAs: "Cvent_File_3.ai",
        url: "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/25471d1b885b40259ecb57778db9272e.ai"
    },
    {
        linkNumber: 10,
        label: "Cloudflare 20 MB 測速",
        name: "Cloudflare_20MB.bin",
        saveAs: "Cloudflare_20MB.bin",
        url: "https://speed.cloudflare.com/__down?bytes=20000000"
    }
];

/* =====================================================================
 * DOM 元素
 * ===================================================================== */

const PENDING_KEY = "cvent_pending_download_records_v1";

const fileList = document.getElementById("file-list");
const uploadStatus = document.getElementById("upload-status");
const uploadButton = document.getElementById("upload-records");
const resetButton = document.getElementById("reset-results");
const overallAverage = document.getElementById("overall-average");
const apiInfo = document.getElementById("api-info");
const uploadMethods = document.querySelectorAll('input[name="upload-method"]');

const fileElements = [];
const completedSpeeds = [];

let uploadRunning = false;
let downloadRunning = false;

/* =====================================================================
 * 工具函數
 * ===================================================================== */

function newID() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
    }
    return Date.now().toString(36) + "-" + Math.random().toString(36).substring(2);
}

let sessionID = sessionStorage.getItem("cvent_session_id");
if (!sessionID) {
    sessionID = newID();
    sessionStorage.setItem("cvent_session_id", sessionID);
}

function gradeSpeed(averageMbps) {
    const percent = (averageMbps / BANDWIDTH_LIMIT_MBPS) * 100;
    const rule = GRADE_RULES.find(item => percent >= item.minPercent) || GRADE_RULES[GRADE_RULES.length - 1];
    return { percent: Number(percent.toFixed(1)), grade: rule.grade };
}

function formatBytes(bytes) {
    if (!Number.isFinite(bytes) || bytes < 0) return "未知";
    const units = ["B", "KB", "MB", "GB", "TB"];
    let value = bytes;
    let index = 0;
    while (value >= 1024 && index < units.length - 1) {
        value /= 1024;
        index++;
    }
    return value.toFixed(index === 0 ? 0 : 2) + " " + units[index];
}

function pad(value) { return String(value).padStart(2, "0"); }

function createUniqueFilename(originalName) {
    const dot = originalName.lastIndexOf(".");
    const base = dot > 0 ? originalName.substring(0, dot) : originalName;
    const extension = dot > 0 ? originalName.substring(dot) : "";
    const now = new Date();
    const timestamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) +
                     "-" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
    return base + "_" + timestamp + "_" + newID().substring(0, 8) + extension;
}

function createNoCacheURL(originalURL) {
    const url = new URL(originalURL);
    url.searchParams.set("_nocache", newID());
    return url.toString();
}

function getSelectedMethod() {
    for (const radio of uploadMethods) {
        if (radio.checked) return radio.value;
    }
    return 'beacon';
}

/* =====================================================================
 * 更新 API 資訊
 * ===================================================================== */

function updateApiInfo() {
    const url = getAPIUrl();
    const status = isIntranet ? 'success' : 'warning';
    const msg = isIntranet ? 
        '✅ 當前在內聯網環境，API：' + url :
        '⚠️ 從 GitHub Pages 訪問，使用 ' + url + '（請選擇合適的上傳方式）';
    apiInfo.className = 'api-info ' + status;
    apiInfo.textContent = msg;
}

/* =====================================================================
 * 更新上傳按鈕顏色
 * ===================================================================== */

function setUploadButtonColor(isSuccess = false) {
    if (isSuccess) {
        uploadButton.className = 'upload-button success';
    } else {
        uploadButton.className = 'upload-button';
    }
}

/* =====================================================================
 * 本頁平均速度
 * ===================================================================== */

function updateOverallAverage() {
    if (completedSpeeds.length === 0) {
        overallAverage.textContent = "尚未完成任何測速";
        return;
    }
    const totalMbps = completedSpeeds.reduce((sum, speed) => sum + speed, 0);
    const averageMbps = totalMbps / completedSpeeds.length;
    const averageMBps = averageMbps / 8;
    overallAverage.textContent = "已完成 " + completedSpeeds.length + 
        " 次｜平均 " + averageMBps.toFixed(2) + " MB/s（" + averageMbps.toFixed(2) + " Mbps）";
}

function addCompletedSpeed(averageMbps) {
    if (!Number.isFinite(averageMbps) || averageMbps < 0) return;
    completedSpeeds.push(averageMbps);
    updateOverallAverage();
}

/* =====================================================================
 * 待上傳紀錄
 * ===================================================================== */

function getPendingRecords() {
    try {
        const records = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
        return Array.isArray(records) ? records : [];
    } catch (_) { return []; }
}

function savePendingRecords(records) {
    localStorage.setItem(PENDING_KEY, JSON.stringify(records));
    updateUploadStatus();
}

function queueRecord(record) {
    const records = getPendingRecords();
    if (!records.some(item => item.record_id === record.record_id)) {
        records.push(record);
        savePendingRecords(records);
        setUploadButtonColor(false);
    }
}

function updateUploadStatus(message = "") {
    const count = getPendingRecords().length;
    if (message) {
        uploadStatus.textContent = message + "｜未上傳紀錄：" + count + " 筆";
        return;
    }
    if (count === 0) {
        uploadStatus.className = "status success";
        uploadStatus.textContent = "目前沒有等待上傳的速度紀錄";
        setUploadButtonColor(true);
    } else {
        uploadStatus.className = "status";
        uploadStatus.textContent = "等待手動上傳至 Server 的紀錄：" + count + " 筆";
        setUploadButtonColor(false);
    }
}

/* =====================================================================
 * 上傳方法 1：Beacon
 * ===================================================================== */

function uploadWithBeacon(records) {
    return new Promise((resolve, reject) => {
        try {
            const blob = new Blob(
                [JSON.stringify({ records })],
                { type: 'application/json' }
            );
            const sent = navigator.sendBeacon(getAPIUrl(), blob);
            if (sent) {
                resolve({ ok: true, text: '已透過 Beacon 發送' });
            } else {
                reject(new Error('Beacon 發送失敗'));
            }
        } catch (error) {
            reject(new Error('Beacon 錯誤：' + (error.message || String(error))));
        }
    });
}

/* =====================================================================
 * 上傳方法 2：Image GET (繞過 CORS)
 * ===================================================================== */

function uploadWithImage(records) {
    return new Promise((resolve, reject) => {
        try {
            // 將資料編碼到 URL (GET 請求)
            const data = JSON.stringify({ records });
            const encoded = encodeURIComponent(data);
            const url = getAPIUrl() + '?data=' + encoded + '&_=' + Date.now();
            
            const img = new Image();
            let resolved = false;
            
            const timeout = setTimeout(() => {
                if (!resolved) {
                    resolved = true;
                    img.src = '';
                    reject(new Error('Image 請求逾時（5秒）'));
                }
            }, 5000);
            
            img.onload = () => {
                if (!resolved) {
                    resolved = true;
                    clearTimeout(timeout);
                    resolve({ ok: true, text: '已透過 Image 發送' });
                }
            };
            
            img.onerror = () => {
                if (!resolved) {
                    resolved = true;
                    clearTimeout(timeout);
                    // 即使 onerror 觸發，請求可能已經發送
                    // 所以我們當作成功（因為無法確認）
                    resolve({ ok: true, text: '已發送（Image 載入失敗，但請求可能已發送）' });
                }
            };
            
            img.src = url;
            
            // 如果 img 沒有觸發任何事件，10 秒後強制完成
            setTimeout(() => {
                if (!resolved) {
                    resolved = true;
                    img.src = '';
                    resolve({ ok: true, text: '已發送（Image 無回應）' });
                }
            }, 10000);
            
        } catch (error) {
            reject(new Error('Image 錯誤：' + (error.message || String(error))));
        }
    });
}

/* =====================================================================
 * 上傳方法 3：iframe Form (無 CORS)
 * ===================================================================== */

function uploadWithIframe(records) {
    return new Promise((resolve, reject) => {
        try {
            const iframeId = 'upload_iframe_' + Date.now();
            const formId = 'upload_form_' + Date.now();

            // 創建 iframe
            const iframe = document.createElement('iframe');
            iframe.id = iframeId;
            iframe.name = iframeId;
            iframe.style.cssText = 'position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none;';
            document.body.appendChild(iframe);

            // 創建 form
            const form = document.createElement('form');
            form.id = formId;
            form.method = 'POST';
            form.action = getAPIUrl();
            form.target = iframeId;
            form.enctype = 'application/x-www-form-urlencoded';
            form.style.cssText = 'position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none;';
            document.body.appendChild(form);

            // 將資料放入 form
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'records';
            input.value = JSON.stringify(records);
            form.appendChild(input);

            let resolved = false;

            // 監聽 iframe 載入
            iframe.onload = () => {
                if (!resolved) {
                    resolved = true;
                    setTimeout(() => {
                        form.remove();
                        iframe.remove();
                    }, 500);
                    resolve({ ok: true, text: '已透過 iframe Form 發送' });
                }
            };

            // 逾時
            setTimeout(() => {
                if (!resolved) {
                    resolved = true;
                    form.remove();
                    iframe.remove();
                    resolve({ ok: true, text: '已發送（iframe 無回應）' });
                }
            }, 10000);

            form.submit();

        } catch (error) {
            reject(new Error('iframe 錯誤：' + (error.message || String(error))));
        }
    });
}

/* =====================================================================
 * 上傳紀錄（主函數）
 * ===================================================================== */

async function flushPendingRecords() {
    if (uploadRunning) return;

    const records = getPendingRecords();
    if (records.length === 0) {
        updateUploadStatus();
        return;
    }

    uploadRunning = true;
    uploadButton.disabled = true;
    uploadStatus.className = "status";
    updateUploadStatus("正在上傳");

    const method = getSelectedMethod();
    const sentIDs = new Set(records.map(r => r.record_id));

    try {
        let result;
        const methodNames = {
            'beacon': 'Beacon',
            'image': 'Image GET',
            'iframe': 'iframe Form'
        };

        switch (method) {
            case 'image':
                result = await uploadWithImage(records);
                break;
            case 'iframe':
                result = await uploadWithIframe(records);
                break;
            case 'beacon':
            default:
                result = await uploadWithBeacon(records);
                break;
        }

        // 移除已上傳的紀錄
        const remaining = getPendingRecords().filter(r => !sentIDs.has(r.record_id));
        savePendingRecords(remaining);

        uploadStatus.className = "status success";
        updateUploadStatus("✅ 成功上傳 " + records.length + " 筆紀錄（方式：' + methodNames[method] + '）");

        setUploadButtonColor(true);

    } catch (error) {
        console.error("上傳失敗：", error);
        let msg = error.message || String(error);

        if (msg.includes('Failed to fetch') || msg.includes('Load failed')) {
            msg = '無法連接伺服器。請嘗試切換上傳方式，或使用內聯網地址訪問。';
        }

        uploadStatus.className = "status error";
        updateUploadStatus("❌ 上傳失敗：" + msg);

        setUploadButtonColor(false);
    } finally {
        uploadRunning = false;
        uploadButton.disabled = false;
    }
}

/* =====================================================================
 * 檔案儲存
 * ===================================================================== */

function clearPreparedFile(elements) {
    if (elements.objectURL) URL.revokeObjectURL(elements.objectURL);
    elements.objectURL = null;
    elements.downloadFilename = null;
    elements.saveButton.style.display = "none";
    elements.saveButton.disabled = true;
}

function prepareFileForSaving(elements, blob, filename) {
    clearPreparedFile(elements);
    elements.objectURL = URL.createObjectURL(blob);
    elements.downloadFilename = filename;
    elements.saveButton.disabled = false;
    elements.saveButton.style.display = "inline-block";
}

function savePreparedFile(elements) {
    if (!elements.objectURL || !elements.downloadFilename) return;
    const link = document.createElement("a");
    link.href = elements.objectURL;
    link.download = elements.downloadFilename;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    link.remove();
}

/* =====================================================================
 * 全頁測速鎖
 * ===================================================================== */

function setDownloadButtonsLocked(locked, activeElements = null) {
    fileElements.forEach(elements => {
        elements.button.disabled = locked;
        if (locked) {
            elements.button.textContent = elements === activeElements ? "下載中…" : "等待目前測速完成";
        } else {
            elements.button.textContent = elements.hasRun ? "再次下載及測速" : "下載及測速";
        }
    });
}

/* =====================================================================
 * 建立 Server 紀錄
 * ===================================================================== */

function createBaseRecord(file, startedAt) {
    return {
        record_id: newID(),
        session_id: sessionID,
        batch_id: null,
        mode: "individual",
        file_index: file.linkNumber,
        file_name: file.name,
        file_label: file.label,
        source_url: file.url,
        status: "unknown",
        bytes: 0,
        elapsed_ms: 0,
        average_MBps: 0,
        average_mbps: 0,
        test_profile: TEST_PROFILE,
        bandwidth_limit_mbps: BANDWIDTH_LIMIT_MBPS,
        speed_ratio_percent: null,
        speed_grade: null,
        started_at: startedAt,
        finished_at: null,
        page_url: location.href,
        user_agent: navigator.userAgent
    };
}

/* =====================================================================
 * 下載及測速
 * ===================================================================== */

async function downloadAndMeasure(file, elements) {
    if (downloadRunning) return;

    downloadRunning = true;
    setDownloadButtonsLocked(true, elements);

    const { progress, status } = elements;
    clearPreparedFile(elements);

    progress.style.display = "block";
    progress.removeAttribute("value");
    progress.removeAttribute("max");
    status.className = "status";
    status.textContent = "正在連接下載 Server…";

    const startedAt = new Date().toISOString();
    const record = createBaseRecord(file, startedAt);
    const startTime = performance.now();

    let receivedBytes = 0;
    let reader = null;

    try {
        const response = await fetch(createNoCacheURL(file.url), {
            method: "GET",
            mode: "cors",
            cache: "no-store",
            credentials: "omit",
            redirect: "follow"
        });

        if (!response.ok) throw new Error("HTTP " + response.status + " " + response.statusText);
        if (!response.body) throw new Error("瀏覽器不支援串流下載");

        const contentLength = Number(response.headers.get("Content-Length")) || 0;
        if (contentLength > 0) { progress.max = contentLength; progress.value = 0; }

        reader = response.body.getReader();
        const chunks = [];
        let lastUpdate = 0;

        while (true) {
            const result = await reader.read();
            if (result.done) break;

            chunks.push(result.value);
            receivedBytes += result.value.byteLength;

            const currentTime = performance.now();
            if (currentTime - lastUpdate >= 100) {
                const seconds = Math.max((currentTime - startTime) / 1000, 0.001);
                const MBps = receivedBytes / seconds / 1_000_000;
                const Mbps = receivedBytes * 8 / seconds / 1_000_000;

                if (contentLength > 0) {
                    progress.value = receivedBytes;
                    const percent = (receivedBytes / contentLength) * 100;
                    status.textContent = formatBytes(receivedBytes) + " / " + formatBytes(contentLength) +
                        "｜" + percent.toFixed(1) + "%｜" + MBps.toFixed(2) + " MB/s｜" + Mbps.toFixed(2) + " Mbps";
                } else {
                    status.textContent = formatBytes(receivedBytes) + "｜" + MBps.toFixed(2) + " MB/s｜" + Mbps.toFixed(2) + " Mbps";
                }
                lastUpdate = currentTime;
            }
        }

        const endTime = performance.now();
        const elapsedSeconds = Math.max((endTime - startTime) / 1000, 0.001);
        const averageMBps = receivedBytes / elapsedSeconds / 1_000_000;
        const averageMbps = receivedBytes * 8 / elapsedSeconds / 1_000_000;
        const rating = gradeSpeed(averageMbps);
        const contentType = response.headers.get("Content-Type") || "application/octet-stream";
        const blob = new Blob(chunks, { type: contentType });
        const filename = createUniqueFilename(file.saveAs || file.name);

        prepareFileForSaving(elements, blob, filename);

        progress.max = receivedBytes || 1;
        progress.value = receivedBytes || 1;

        record.status = "success";
        record.bytes = receivedBytes;
        record.elapsed_ms = Math.round(elapsedSeconds * 1000);
        record.average_MBps = Number(averageMBps.toFixed(3));
        record.average_mbps = Number(averageMbps.toFixed(3));
        record.speed_ratio_percent = rating.percent;
        record.speed_grade = rating.grade;
        record.finished_at = new Date().toISOString();

        status.className = "status success";
        status.style.whiteSpace = "pre-line";
        status.textContent = "下載完成\n耗時：" + elapsedSeconds.toFixed(2) + " 秒\n平均速度：" +
            averageMBps.toFixed(2) + " MB/s（" + averageMbps.toFixed(2) + " Mbps）\n檔名：" + filename;

        addCompletedSpeed(averageMbps);
        queueRecord(record);
        return record;

    } catch (error) {
        console.error(error);
        const endTime = performance.now();
        let message = error.message || String(error);
        if (message.includes("Failed to fetch") || message.includes("Load failed")) {
            message = "無法讀取檔案，可能是 CORS 或網路連線問題";
        }

        record.status = "failed";
        record.bytes = receivedBytes;
        record.elapsed_ms = Math.round(endTime - startTime);
        record.finished_at = new Date().toISOString();
        record.error = message;

        status.style.whiteSpace = "normal";
        status.className = "status error";
        status.textContent = "下載失敗：" + message;
        queueRecord(record);
        return record;

    } finally {
        if (reader) { try { reader.releaseLock(); } catch (_) {} }
        elements.hasRun = true;
        downloadRunning = false;
        setDownloadButtonsLocked(false);
    }
}

/* =====================================================================
 * 建立檔案卡片
 * ===================================================================== */

files.forEach(file => {
    const card = document.createElement("section");
    card.className = "file-card";

    const fileName = document.createElement("div");
    fileName.className = "file-name";
    fileName.textContent = file.label + "：" + file.name;

    const fileURL = document.createElement("div");
    fileURL.className = "file-url";
    fileURL.textContent = file.url;

    const actions = document.createElement("div");
    actions.className = "file-actions";

    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "下載及測速";

    const saveButton = document.createElement("button");
    saveButton.type = "button";
    saveButton.className = "save-button";
    saveButton.textContent = "儲存檔案（可選）";
    saveButton.disabled = true;

    const progress = document.createElement("progress");
    const status = document.createElement("div");
    status.className = "status";
    status.textContent = "尚未開始";

    const elements = {
        button, saveButton, progress, status,
        hasRun: false,
        objectURL: null,
        downloadFilename: null
    };

    fileElements.push(elements);

    button.addEventListener("click", () => downloadAndMeasure(file, elements));
    saveButton.addEventListener("click", () => savePreparedFile(elements));

    actions.append(button, saveButton);
    card.append(fileName, fileURL, actions, progress, status);
    fileList.appendChild(card);
});

/* =====================================================================
 * 按鈕事件
 * ===================================================================== */

uploadButton.addEventListener("click", flushPendingRecords);

resetButton.addEventListener("click", () => {
    if (downloadRunning) return;
    fileElements.forEach(elements => {
        clearPreparedFile(elements);
        elements.progress.style.display = "none";
        elements.progress.removeAttribute("value");
        elements.progress.removeAttribute("max");
        elements.status.style.whiteSpace = "normal";
        elements.status.className = "status";
        elements.status.textContent = "尚未開始";
        elements.hasRun = false;
        elements.button.textContent = "下載及測速";
    });
    completedSpeeds.length = 0;
    updateOverallAverage();
});

window.addEventListener("pagehide", () => {
    fileElements.forEach(e => { if (e.objectURL) { URL.revokeObjectURL(e.objectURL); e.objectURL = null; } });
});

/* =====================================================================
 * 初始化
 * ===================================================================== */

updateApiInfo();
updateOverallAverage();
updateUploadStatus();
setUploadButtonColor(getPendingRecords().length === 0);

console.log('🔍 當前環境：', {
    host: currentHost,
    isIntranet: isIntranet,
    api: getAPIUrl(),
    health: getHealthUrl()
});
</script>
