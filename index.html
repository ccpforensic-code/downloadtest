<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多機定時同步下載器 (7檔平行下載版)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; background: #f4f7f6; color: #333; }
        .card { background: white; max-width: 450px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .clock { font-size: 32px; font-weight: bold; margin: 10px 0; color: #007bff; }
        input[type="time"] { font-size: 20px; padding: 6px; margin: 10px 0; }
        .btn { font-size: 16px; padding: 10px 20px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px 0; width: 100%; }
        .btn-test { background: #6c757d; }
        .btn-arm { background: #28a745; }
        .btn:disabled { background: #cccccc; }
        .status { margin-top: 15px; font-size: 15px; font-weight: bold; color: #007bff; }
        .log-box { font-size: 12px; color: #333; text-align: left; background: #eef; padding: 12px; border-radius: 6px; margin-top: 15px; max-height: 220px; overflow-y: auto; line-height: 1.6; }
        .highlight { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>⏰ 多機定時同步下載器</h2>
    <div id="currentTime" class="clock">00:00:00</div>

    <label for="targetTime"><b>設定預計下載時間：</b></label><br>
    <input type="time" id="targetTime" step="1"><br>
    <button id="startBtn" class="btn btn-arm" onclick="armTimer()">確認啟動排程</button>

    <div id="status" class="status">狀態：等待設定時間...</div>

    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

    <button class="btn btn-test" onclick="executeDownload()">（可選）測試 7 檔平行下載</button>

    <div class="log-box" id="logBox">
        <b>📝 下載記錄與耗時：</b><br>
        (等待啟動...)
    </div>
</div>

<script>
    // 7 個 .ai 檔案連結陣列
    const fileUrls = [
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/25471d1b885b40259ecb57778db9272e.ai",
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/7d91438e5a634cef9433396b66174af8.ai",
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/8261c18c11e5423aa251ffde02edec2e.ai",
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/d936be7a88d549f3bfa7388c09f3868b.ai",
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/409adf45fd48497abd4609d995dec523.ai",
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/661b4023226143729514b23c34f5b2b0.ai",
        "https://custom-eur.cvent.com/4d8b46bb42e14086a1dafae4e5ab4b4e/files/fd0dba4d73ae4225bce3d445ee6dd1f6.ai"
    ];

    let targetTimeString = "";

    // 1. 每秒更新時鐘
    function updateClock() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        const currentTimeStr = `${hrs}:${mins}:${secs}`;
        document.getElementById("currentTime").innerText = currentTimeStr;

        if (targetTimeString && currentTimeStr === targetTimeString) {
            triggerDownload();
        }
    }
    setInterval(updateClock, 1000);

    // 2. 隨機檔名生成器 (擴充支援 .ai 副檔名)
    function generateRandomFileName(index) {
        const now = new Date();
        const dateStr = now.getFullYear() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0') + "_" +
            String(now.getHours()).padStart(2, '0') +
            String(now.getMinutes()).padStart(2, '0') +
            String(now.getSeconds()).padStart(2, '0');
        
        const randomStr = Math.random().toString(36).substring(2, 6);
        return `file${index + 1}_${dateStr}_${randomStr}.ai`;
    }

    // 3. 設定排程時間
    function armTimer() {
        const inputVal = document.getElementById("targetTime").value;
        if (!inputVal) return alert("請先選擇時間！");
        targetTimeString = inputVal.length === 5 ? `${inputVal}:00` : inputVal;

        document.getElementById("status").innerText = `已排程！將在 ${targetTimeString} 自動平行下載 7 個檔案`;
        document.getElementById("status").style.color = "#28a745";
        document.getElementById("startBtn").disabled = true;
    }

    // 4. 時間到達時觸發
    function triggerDownload() {
        document.getElementById("status").innerText = "🚀 時間到！發起 7 檔平行下載中...";
        document.getElementById("status").style.color = "#007bff";
        executeDownload();
        targetTimeString = "";
    }

    // 5. 單檔下載與獨立計時器
    async function fetchAndSaveWithTiming(fileUrl, fileName, index) {
        const startTime = performance.now();
        
        const response = await fetch(fileUrl);
        const blob = await response.blob();
        
        const endTime = performance.now();
        const durationSec = ((endTime - startTime) / 1000).toFixed(2);

        // 觸發瀏覽器下載
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);

        return { index: index + 1, fileName, durationSec };
    }

    // 6. 核心執行：7 個檔案同時發起 Promise.all 下載
    async function executeDownload() {
        document.getElementById("logBox").innerHTML = `
            <b>📝 下載記錄與耗時：</b><br>
            ⏳ 7 個檔案下載中，請稍候...
        `;

        const totalStartTime = performance.now();

        try {
            // 動態建立 7 個 Promise 下載任務
            const downloadPromises = fileUrls.map((url, index) => {
                const fileName = generateRandomFileName(index);
                return fetchAndSaveWithTiming(url, fileName, index);
            });

            // 7 個檔案同時平行下載
            const results = await Promise.all(downloadPromises);

            const totalEndTime = performance.now();
            const totalDurationSec = ((totalEndTime - totalStartTime) / 1000).toFixed(2);

            // 組合 7 個檔案的結果記錄
            let logHtml = `<b>📝 7 檔下載成功耗時統計：</b><br>`;
            results.forEach(res => {
                logHtml += `📄 檔 ${res.index} (${res.fileName})：<span class="highlight">${res.durationSec} 秒</span><br>`;
            });
            logHtml += `⏱️ <b>平行總耗時：<span class="highlight">${totalDurationSec} 秒</span></b>`;

            document.getElementById("logBox").innerHTML = logHtml;
            document.getElementById("status").innerText = "✅ 7 個檔案已全部下載完成！";
        } catch (err) {
            console.error(err);
            document.getElementById("logBox").innerHTML = `❌ 下載失敗或遭跨域/瀏覽器阻擋。`;
        }
    }
</script>

</body>
</html>
